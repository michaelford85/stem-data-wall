<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img"
     aria-label="How the pieces fit together: an iPad controller sends taps over Wi-Fi to a Raspberry Pi, which runs the app, database and dashboards, and shows live results on a big monitor.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
    .name  { font-size: 19px; font-weight: 700; fill: #0f172a; }
    .sub   { font-size: 14px; fill: #475569; }
    .flow  { font-size: 14px; font-weight: 600; fill: #334155; }
    .pill  { font-size: 13px; font-weight: 600; fill: #0f172a; }
  </style>

  <!-- card background so text is readable in both light and dark GitHub themes -->
  <rect x="1" y="1" width="978" height="438" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="48" class="title">How the pieces fit together</text>

  <!-- ================= iPad ================= -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="210" height="150" rx="20" fill="#1f2937"/>
    <rect x="14" y="14" width="182" height="122" rx="7" fill="#e0f2fe"/>
    <circle cx="105" cy="8" r="2.5" fill="#64748b"/>
    <circle cx="105" cy="143" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- mini game board on screen: 3 columns of colored tiles -->
    <g>
      <rect x="24"  y="24" width="52" height="30" rx="4" fill="#2563eb"/>
      <rect x="84"  y="24" width="52" height="30" rx="4" fill="#dc2626"/>
      <rect x="144" y="24" width="52" height="30" rx="4" fill="#16a34a"/>
      <rect x="24"  y="60" width="52" height="30" rx="4" fill="#2563eb" opacity="0.8"/>
      <rect x="84"  y="60" width="52" height="30" rx="4" fill="#dc2626" opacity="0.8"/>
      <rect x="144" y="60" width="52" height="30" rx="4" fill="#16a34a" opacity="0.8"/>
      <rect x="24"  y="96" width="52" height="28" rx="4" fill="#7c3aed"/>
      <rect x="84"  y="96" width="52" height="28" rx="4" fill="#7c3aed" opacity="0.8"/>
      <rect x="144" y="96" width="52" height="28" rx="4" fill="#f59e0b"/>
    </g>
    <text x="105" y="178" text-anchor="middle" class="name">iPad</text>
    <text x="105" y="198" text-anchor="middle" class="sub">kids tap the answers</text>
    <text x="105" y="216" text-anchor="middle" class="sub">(or a number pad / buttons)</text>
  </g>

  <!-- arrow: iPad -> Pi -->
  <g>
    <line x1="258" y1="185" x2="366" y2="185" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="366,178 382,185 366,192" fill="#94a3b8"/>
    <text x="320" y="168" text-anchor="middle" class="flow">taps · Wi-Fi</text>
  </g>

  <!-- ================= Raspberry Pi ================= -->
  <g transform="translate(388,100)">
    <rect x="0" y="0" width="214" height="172" rx="10" fill="#15803d"/>
    <!-- mounting holes -->
    <circle cx="12" cy="12" r="5" fill="#0b4a22"/>
    <circle cx="202" cy="12" r="5" fill="#0b4a22"/>
    <circle cx="12" cy="160" r="5" fill="#0b4a22"/>
    <circle cx="202" cy="160" r="5" fill="#0b4a22"/>
    <!-- GPIO header -->
    <rect x="26" y="10" width="162" height="16" rx="2" fill="#0b0f14"/>
    <g fill="#eab308">
      <rect x="30"  y="13" width="4" height="10"/><rect x="41" y="13" width="4" height="10"/>
      <rect x="52"  y="13" width="4" height="10"/><rect x="63" y="13" width="4" height="10"/>
      <rect x="74"  y="13" width="4" height="10"/><rect x="85" y="13" width="4" height="10"/>
      <rect x="96"  y="13" width="4" height="10"/><rect x="107" y="13" width="4" height="10"/>
      <rect x="118" y="13" width="4" height="10"/><rect x="129" y="13" width="4" height="10"/>
      <rect x="140" y="13" width="4" height="10"/><rect x="151" y="13" width="4" height="10"/>
      <rect x="162" y="13" width="4" height="10"/><rect x="173" y="13" width="4" height="10"/>
    </g>
    <!-- SoC chip -->
    <rect x="40" y="52" width="52" height="52" rx="4" fill="#0b0f14"/>
    <text x="66" y="83" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">CPU</text>
    <!-- USB / ethernet ports sticking out the right side -->
    <rect x="202" y="46" width="22" height="22" rx="2" fill="#cbd5e1"/>
    <rect x="202" y="78" width="22" height="22" rx="2" fill="#cbd5e1"/>
    <rect x="202" y="110" width="22" height="24" rx="2" fill="#94a3b8"/>
    <!-- raspberry logo (berry + leaves) -->
    <g transform="translate(150,118)">
      <path d="M -6,-16 C -14,-22 -2,-24 0,-15 C 2,-24 14,-22 6,-16 Z" fill="#15803d" stroke="#0b4a22" stroke-width="1"/>
      <g fill="#dc2626">
        <circle cx="0" cy="-8" r="5"/><circle cx="-7" cy="-3" r="5"/><circle cx="7" cy="-3" r="5"/>
        <circle cx="-4" cy="4" r="5"/><circle cx="4" cy="4" r="5"/><circle cx="0" cy="10" r="5"/>
      </g>
    </g>
    <text x="107" y="150" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Raspberry Pi</text>
  </g>

  <!-- what the Pi runs (pills under it) -->
  <g>
    <text x="495" y="296" text-anchor="middle" class="name">Raspberry Pi</text>
    <text x="495" y="316" text-anchor="middle" class="sub">the brain — runs everything, no internet</text>
    <g>
      <rect x="372" y="330" width="86" height="26" rx="13" fill="#e2e8f0"/>
      <text x="415" y="347" text-anchor="middle" class="pill">Node app</text>
      <rect x="464" y="330" width="86" height="26" rx="13" fill="#e2e8f0"/>
      <text x="507" y="347" text-anchor="middle" class="pill">MongoDB</text>
      <rect x="556" y="330" width="80" height="26" rx="13" fill="#e2e8f0"/>
      <text x="596" y="347" text-anchor="middle" class="pill">Grafana</text>
    </g>
  </g>

  <!-- arrow: Pi -> Monitor -->
  <g>
    <line x1="610" y1="185" x2="722" y2="185" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="722,178 738,185 722,192" fill="#94a3b8"/>
    <text x="674" y="168" text-anchor="middle" class="flow">live results</text>
  </g>

  <!-- ================= Monitor ================= -->
  <g transform="translate(744,110)">
    <rect x="0" y="0" width="200" height="140" rx="10" fill="#1f2937"/>
    <rect x="12" y="12" width="176" height="104" rx="5" fill="#0f172a"/>
    <!-- bar chart on screen -->
    <g>
      <rect x="34"  y="62" width="24" height="44" fill="#3b82f6"/>
      <rect x="72"  y="46" width="24" height="60" fill="#ef4444"/>
      <rect x="110" y="34" width="24" height="72" fill="#22c55e"/>
      <rect x="148" y="72" width="24" height="34" fill="#a855f7"/>
    </g>
    <!-- stand -->
    <rect x="92" y="140" width="16" height="16" fill="#1f2937"/>
    <rect x="62" y="156" width="76" height="8" rx="3" fill="#1f2937"/>
    <text x="100" y="186" text-anchor="middle" class="name">Monitor</text>
    <text x="100" y="206" text-anchor="middle" class="sub">the big screen everyone watches</text>
  </g>
</svg>
