# ===========================================================================
# questions.yaml — the whole game, in one file you can edit WITHOUT touching
# any code. Change the words, swap emoji, pick new colors, then just reload
# the page (the app re-reads this file on every board load).
#
# Audience: grades 3-8 (about ages 8-14). Keep it short, kind, and clear —
# readable on the big monitor from a few feet away.
#
# Difficulty ramps WITHIN each category (shown on the board as points, Jeopardy
# style). The points are just labels — there is no scoring or leaderboard:
#   1st tile = 100  easy       (3rd-4th grade)
#   2nd tile = 200  medium     (5th-6th grade)
#   3rd tile = 300  challenging(7th-8th grade)
#
# Structure:
#   categories: the 4 columns on the board (order matters)
#   questions:  3 questions per category, keyed by the category "key"
#   mystery:    the two AMA ("Ask Us Anything") tiles — the team answers aloud
#
# Each question has:
#   id       a short unique code (used only in the anonymous data)
#   text     the question shown in HUGE letters on the monitor
#   fact     a fun fact shown after the answer is revealed
#   correct  the id (a/b/c/d) of the right answer
#   answers  exactly 4, each with: id, emoji, label, color
# ===========================================================================

categories:
  - key: data_detectives
    name: Data Detectives
    color: "#2563eb" # blue
  - key: spot_the_trick
    name: Spot the Trick
    color: "#dc2626" # red
  - key: tech_careers
    name: Tech Careers
    color: "#16a34a" # green
  - key: computers_real_life
    name: Computers in Real Life
    color: "#9333ea" # purple

questions:
  # ------------------------------------------------------------------ #
  # Data Detectives — data, algorithms, databases, decisions
  data_detectives:
    - id: dd1 # 100 · easy
      text: "What is an ALGORITHM?"
      correct: b
      fact: "Even a recipe is an algorithm — a clear list of steps done in order. Computers follow algorithms to get things done."
      answers:
        - { id: a, emoji: "🎵", label: "A type of music beat", color: "#2563eb" }
        - { id: b, emoji: "🪜", label: "A step-by-step set of instructions", color: "#f59e0b" }
        - { id: c, emoji: "🔑", label: "A secret password", color: "#16a34a" }
        - { id: d, emoji: "📷", label: "A kind of camera", color: "#ef4444" }
    - id: dd2 # 200 · medium
      text: "What does a DATABASE do?"
      correct: a
      fact: "A library is like a database for books — everything is organized so you can find just what you need quickly."
      answers:
        - { id: a, emoji: "🗄️", label: "Stores data so you can search it fast", color: "#2563eb" }
        - { id: b, emoji: "📺", label: "Shows websites on a screen", color: "#f59e0b" }
        - { id: c, emoji: "🎮", label: "Runs a video game", color: "#16a34a" }
        - { id: d, emoji: "🖨️", label: "Prints documents on paper", color: "#ef4444" }
    - id: dd3 # 300 · challenging
      text: "A store sees umbrellas sell out when rain is forecast. The smart move is…"
      correct: c
      fact: "Using past data to predict what people will need is how businesses plan ahead. That's data-driven decision making."
      answers:
        - { id: a, emoji: "🎲", label: "Order umbrellas at random", color: "#2563eb" }
        - { id: b, emoji: "🚫", label: "Stop selling umbrellas", color: "#f59e0b" }
        - { id: c, emoji: "☔", label: "Stock more before rainy days", color: "#16a34a" }
        - { id: d, emoji: "🥛", label: "Lower the price of milk", color: "#ef4444" }

  # ------------------------------------------------------------------ #
  # Spot the Trick — phishing, strong passwords, two-factor
  spot_the_trick:
    - id: st1 # 100 · easy
      text: "An email says 'Your account is LOCKED! Click now!' What's the clue it's fake?"
      correct: a
      fact: "Scam messages try to rush you so you won't stop and think. Slow down and check with an adult before clicking."
      answers:
        - { id: a, emoji: "🚨", label: "It rushes you and creates panic", color: "#2563eb" }
        - { id: b, emoji: "📅", label: "It was sent on a weekday", color: "#f59e0b" }
        - { id: c, emoji: "🔤", label: "It uses full sentences", color: "#16a34a" }
        - { id: d, emoji: "🖼️", label: "It shows a company logo", color: "#ef4444" }
    - id: st2 # 200 · medium
      text: "Which makes the STRONGEST password?"
      correct: d
      fact: "Length matters most. A long phrase of a few random words is much harder to guess than a short tricky one."
      answers:
        - { id: a, emoji: "🐱", label: "Your pet's name", color: "#2563eb" }
        - { id: b, emoji: "🔢", label: "123456", color: "#f59e0b" }
        - { id: c, emoji: "🎂", label: "Your birthday", color: "#16a34a" }
        - { id: d, emoji: "🧩", label: "A long phrase of random words", color: "#ef4444" }
    - id: st3 # 300 · challenging
      text: "Two-factor authentication keeps an account safer by…"
      correct: b
      fact: "Two factors means two kinds of proof — something you know (a password) plus something you have (a code on your phone). A stolen password alone isn't enough."
      answers:
        - { id: a, emoji: "🔁", label: "Making you type your password twice", color: "#2563eb" }
        - { id: b, emoji: "🔐", label: "Also needing a second code, not just a password", color: "#f59e0b" }
        - { id: c, emoji: "🗑️", label: "Deleting your password each week", color: "#16a34a" }
        - { id: d, emoji: "📢", label: "Sharing your password with a friend", color: "#ef4444" }

  # ------------------------------------------------------------------ #
  # Tech Careers — cybersecurity, automation, architecture, sales
  tech_careers:
    - id: tc1 # 100 · easy
      text: "A CYBERSECURITY ANALYST spends the day…"
      correct: a
      fact: "Cybersecurity analysts watch for hackers and fix weak spots — like digital security guards for information."
      answers:
        - { id: a, emoji: "🛡️", label: "Protecting computers and data from attacks", color: "#2563eb" }
        - { id: b, emoji: "🍳", label: "Cooking food in a restaurant", color: "#f59e0b" }
        - { id: c, emoji: "🚚", label: "Driving delivery trucks", color: "#16a34a" }
        - { id: d, emoji: "🎨", label: "Painting houses", color: "#ef4444" }
    - id: tc2 # 200 · medium
      text: "An AUTOMATION ENGINEER mostly…"
      correct: c
      fact: "Automation engineers teach computers to handle boring, repeated jobs — freeing people up for creative work."
      answers:
        - { id: a, emoji: "🎨", label: "Designs an app's colors and buttons", color: "#2563eb" }
        - { id: b, emoji: "🛡️", label: "Hunts for hackers breaking in", color: "#f59e0b" }
        - { id: c, emoji: "🤖", label: "Writes code so computers repeat tasks on their own", color: "#16a34a" }
        - { id: d, emoji: "🧱", label: "Builds the physical computer chips", color: "#ef4444" }
    - id: tc3 # 300 · challenging
      text: "A SOLUTIONS ARCHITECT's main job is to…"
      correct: a
      fact: "Solutions architects plan the big picture of a system. Technical sales engineers then show customers how that solution solves their real problem."
      answers:
        - { id: a, emoji: "🏗️", label: "Design how all the tech pieces fit together", color: "#2563eb" }
        - { id: b, emoji: "🛡️", label: "Watch for hackers all day", color: "#f59e0b" }
        - { id: c, emoji: "🤖", label: "Automate one repeated task", color: "#16a34a" }
        - { id: d, emoji: "🧪", label: "Test apps for bugs", color: "#ef4444" }

  # ------------------------------------------------------------------ #
  # Computers in Real Life — the cloud, GPS, binary
  computers_real_life:
    - id: cr1 # 100 · easy
      text: "When files are saved 'in the CLOUD,' they're really stored…"
      correct: b
      fact: "The 'cloud' is just other people's computers — servers in big data centers — that you reach over the internet."
      answers:
        - { id: a, emoji: "🌧️", label: "Inside real rain clouds", color: "#2563eb" }
        - { id: b, emoji: "🖥️", label: "On powerful computers in data centers", color: "#f59e0b" }
        - { id: c, emoji: "🌙", label: "On the moon", color: "#16a34a" }
        - { id: d, emoji: "📼", label: "Only on your own phone", color: "#ef4444" }
    - id: cr2 # 200 · medium
      text: "How does a phone's MAP know where you are?"
      correct: a
      fact: "GPS uses satellites in space; your phone compares their signals to pinpoint you. Wi-Fi and cell towers can help it get a fix faster."
      answers:
        - { id: a, emoji: "🛰️", label: "Signals from GPS satellites in space", color: "#2563eb" }
        - { id: b, emoji: "🔋", label: "The phone's battery level", color: "#f59e0b" }
        - { id: c, emoji: "📷", label: "The camera taking photos", color: "#16a34a" }
        - { id: d, emoji: "⌨️", label: "You type your address every time", color: "#ef4444" }
    - id: cr3 # 300 · challenging
      text: "Deep down, computers store ALL data — words, photos, music — as…"
      correct: d
      fact: "Everything in a computer is binary — just 1s and 0s. Eight of them make a 'byte', enough to store a single letter."
      answers:
        - { id: a, emoji: "🔤", label: "Tiny printed letters", color: "#2563eb" }
        - { id: b, emoji: "🎨", label: "Microscopic dots of paint", color: "#f59e0b" }
        - { id: c, emoji: "🧲", label: "Small magnets spelling words", color: "#16a34a" }
        - { id: d, emoji: "🔢", label: "1s and 0s (binary)", color: "#ef4444" }

# ===========================================================================
# The two AMA ("Ask Us Anything") tiles. The monitor shows the prompt; a team
# member taps one topic on the iPad and then answers OUT LOUD. We store ONLY
# the chosen topic — never anything the team or kids say.
# ===========================================================================
mystery:
  monitor_prompt: "AMA: Ask Us Anything about our jobs!"
  topics:
    - { id: started, emoji: "🚀", label: "How did you get started?" }
    - { id: school, emoji: "🎓", label: "School and learning" }
    - { id: money, emoji: "💰", label: "Money" }
    - { id: day, emoji: "🗓️", label: "A day at work" }
    - { id: other, emoji: "💬", label: "Something else" }
