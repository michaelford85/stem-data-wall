# Ansible configuration for the STEM Data Wall.
# Run playbooks from inside this ansible/ directory so these settings apply.
[defaults]
inventory = inventory.example.ini
roles_path = roles
collections_path = collections
host_key_checking = False
retry_files_enabled = False
# Use ansible-core's built-in default callback with YAML-formatted results.
# (The old "yaml" stdout callback lived in community.general and is deprecated;
# ansible-core formats results as YAML natively via callback_result_format.)
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
# Keep output readable for first-timers.
display_skipped_hosts = False

[privilege_escalation]
become = True
become_method = sudo
