# Example inventory for provisioning the Raspberry Pi from your laptop.
# Copy to inventory.ini and edit the host/user to match your Pi.
#
#   cp inventory.example.ini inventory.ini
#   ansible-playbook -i inventory.ini site.yml
#
# To run ON the Pi itself instead (no SSH), skip the inventory file:
#   ansible-playbook -i localhost, -c local site.yml

[datawall]
# Any hostname or IP that reaches the Pi works here. The Pi's hostname is NOT
# changed by this project, so use its existing mDNS name "<hostname>.local"
# (avahi publishes it), or its IP address. Example for a Pi named "ubuntu-server-5":
pi ansible_host=ubuntu-server-5.local

[datawall:vars]
# The login user on the Pi (Ubuntu Server default is often "ubuntu";
# Raspberry Pi OS is often "pi" or your chosen user).
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
