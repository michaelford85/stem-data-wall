---
# ===========================================================================
# All tunable settings in one place. Override any of these with -e on the
# command line, e.g.  ansible-playbook site.yml -e buttons_enabled=true
# ===========================================================================

# ---- project / repo --------------------------------------------------------
project_name: stem-data-wall
repo_url: "https://github.com/michaelford85/stem-data-wall.git"
repo_version: main
install_dir: /opt/stem-data-wall
# Set false for a local run where the code already lives in install_dir
# (then point install_dir at your checkout).
app_clone_repo: true

# ---- system ----------------------------------------------------------------
# We do NOT change the Pi's hostname. datawall_host is the name/URL the Pi is
# reached by: its EXISTING hostname plus ".local" (published over mDNS by
# avahi). Override with an IP if mDNS is unavailable on your network, e.g.
#   ansible-playbook site.yml -e datawall_host=192.168.8.10
datawall_host: "{{ ansible_hostname }}.local"
timezone: America/Chicago
station: table-1

# ---- event mode ------------------------------------------------------------
# Set true (via -e event_mode=true, or ansible/event-mode.yml) to stop and
# disable unattended-upgrades and the apt-daily timers so nothing grabs the
# apt lock or restarts services during the event. Re-enable afterward with
# event-mode.yml -e event_mode=false.
event_mode: false

# ---- secrets ---------------------------------------------------------------
# Leave admin_pin empty to auto-generate a random 4-digit PIN into .env the
# first time (it is printed at the end of the run). MongoDB passwords are
# always auto-generated into .env and never stored in git.
admin_pin: ""

# ---- app / grafana ---------------------------------------------------------
# The page the kiosk Chromium opens full-screen, on the Pi itself. Deliberately
# localhost so the Pi's OWN screen never depends on mDNS resolving. Other
# devices reach the Pi by datawall_host (<hostname>.local); this URL is only
# ever used locally on the Pi.
monitor_url: "http://localhost:8080/"
grafana_plugin: yesoreyeram-infinity-datasource
# Pin Grafana and the Infinity plugin TOGETHER, and never use "latest".
# Infinity 4.1.6's plugin.json requires Grafana >= 12.2.5 (its grafanaDependency
# is ">=11.6.11-0 <12 || ... || >=12.2.5-0"), which grafana-oss 12.4.3 satisfies.
# 12.4.3 is the newest multi-arch (arm64) grafana-oss image. To bump, change both
# and re-check the plugin's grafanaDependency at
# https://grafana.com/api/plugins/yesoreyeram-infinity-datasource/versions
grafana_version: "12.4.3"
grafana_infinity_version: "4.1.6"

# ---- kiosk -----------------------------------------------------------------
kiosk_user: kiosk
# Extra Chromium flags appended to the kiosk launch command.
kiosk_chromium_extra_flags: ""

# ---- optional GPIO buttons (off by default) --------------------------------
buttons_enabled: false
buttons_pins: [17, 27, 22, 23]
buttons_app_url: "http://127.0.0.1:8080"

# ---- teardown (used by teardown.yml) --------------------------------------
teardown_backup: true                 # back up events to the laptop first
teardown_purge_kiosk_packages: false  # also remove cage + chromium
teardown_purge_docker: false          # also remove Docker Engine + repo
teardown_revert_system: false         # stop/disable avahi + remove state dir
