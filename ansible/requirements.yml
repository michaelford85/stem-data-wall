---
# Ansible Galaxy requirements for the STEM Data Wall.
# Install with:
#     ansible-galaxy collection install -r ansible/requirements.yml
#
# The playbooks need ansible-core (>= 2.17, for the ansible.builtin.systemd_service
# module) plus the collections listed below. `make ansible-deps` and the README
# both run the install command above; ansible.cfg sets collections_path = collections
# so they install into ansible/collections/ (which is git-ignored).
#
# On a clean machine:
#     python3 -m pip install "ansible-core>=2.17"
#     ansible-galaxy collection install -r ansible/requirements.yml
#
# To add another dependency later, append it here with a minimum version and the
# same install command will pull it in.
collections:
  - name: community.general
    version: ">=8.0.0"
