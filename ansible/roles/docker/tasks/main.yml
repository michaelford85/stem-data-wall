---
# Install Docker Engine + the compose plugin from Docker's official apt repo.
# OS-aware: works on Ubuntu (Pi 5 default) and Debian / Raspberry Pi OS.

- name: Determine Docker apt settings for this OS/arch
  ansible.builtin.set_fact:
    docker_os: "{{ ansible_facts['distribution'] }}"
    docker_codename: "{{ ansible_facts['distribution_release'] }}"
    docker_arch: "{{ docker_arch_map[ansible_facts['architecture']] | default('amd64') }}"

- name: Fail early on an unsupported distribution
  ansible.builtin.assert:
    that: docker_os in docker_gpg_url_map
    fail_msg: >-
      Unsupported distribution '{{ docker_os }}'. This role supports Ubuntu and
      Debian / Raspberry Pi OS.

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url_map[docker_os] }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_repo_base_map[docker_os] }} {{ docker_codename }} stable
    filename: docker
    state: present

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add the login user to the docker group so docker runs without sudo
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
