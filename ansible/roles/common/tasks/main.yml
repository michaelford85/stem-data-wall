---
# Base system setup: mDNS (<hostname>.local), timezone, packages.
# NOTE: we deliberately do NOT change the Pi's hostname — whatever name the
# machine already has is kept, and it is reached as "<that hostname>.local".

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Timezone, idempotently, without needing extra collections.
- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: common_current_tz
  changed_when: false

- name: Set the timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  when: common_current_tz.stdout | trim != timezone
  changed_when: true

# avahi publishes "<hostname>.local" on the local network via mDNS, so the
# laptop and iPad can reach the Pi by name without changing the hostname.
- name: Enable and start avahi-daemon (publishes <hostname>.local)
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started

# ---- event mode (optional): silence background updates --------------------
# Pass -e event_mode=true to stop and disable unattended-upgrades and the
# apt-daily timers, so nothing grabs the apt lock or restarts services during
# the event. Re-enable afterward with: event-mode.yml -e event_mode=false.
# Guarded so it is harmless where a unit is not installed (e.g. Pi OS).
- name: Disable background apt updates for the event
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - unattended-upgrades.service
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
  failed_when: false
  when: event_mode | bool
