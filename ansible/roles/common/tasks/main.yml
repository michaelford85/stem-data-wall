---
# Base system setup: hostname, mDNS (datawall.local), timezone, packages.

- name: Create the state directory
  ansible.builtin.file:
    path: "{{ common_state_dir }}"
    state: directory
    mode: "0755"

# Record the ORIGINAL hostname once, before we change it, so teardown can
# restore it. force:false means we never overwrite it on later runs.
- name: Record the original hostname (once, for teardown)
  ansible.builtin.copy:
    content: "{{ ansible_facts['hostname'] }}\n"
    dest: "{{ common_state_dir }}/original-hostname"
    force: false
    mode: "0644"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Timezone, idempotently, without needing extra collections.
- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: common_current_tz
  changed_when: false

- name: Set the timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  when: common_current_tz.stdout | trim != timezone
  changed_when: true

- name: Set the hostname to {{ datawall_hostname }}
  ansible.builtin.hostname:
    name: "{{ datawall_hostname }}"

- name: Ensure 127.0.1.1 maps to the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\b'
    line: "127.0.1.1\t{{ datawall_hostname }}"
    state: present

# avahi publishes datawall.local on the local network via mDNS.
- name: Enable and start avahi-daemon (datawall.local)
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started
