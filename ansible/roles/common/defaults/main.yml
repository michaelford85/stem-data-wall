---
# Base packages installed on every host. fonts-noto-color-emoji makes the
# answer emoji render in full color on the kiosk, offline.
common_base_packages:
  - avahi-daemon
  - ca-certificates
  - curl
  - git
  - gnupg
  - python3
  - fonts-noto-color-emoji

# Where we record facts (like the original hostname) so teardown can undo them.
common_state_dir: /etc/stem-data-wall
