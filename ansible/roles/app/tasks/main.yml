---
# Deploy and run the app stack: clone the repo, generate .env (with random
# secrets) if missing, pre-pull images, and bring the stack up.

- name: Install host Python packages for the reset/seed scripts
  ansible.builtin.apt:
    name: "{{ app_host_python_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clone/update the repository
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ install_dir }}"
    version: "{{ repo_version }}"
  when: app_clone_repo | bool

- name: Ensure the install directory exists (local/no-clone runs)
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0755"

# --- .env is generated ONCE with random secrets, then left untouched --------
- name: Check whether .env already exists
  ansible.builtin.stat:
    path: "{{ install_dir }}/.env"
  register: app_envfile

- name: Generate secrets for a new .env
  ansible.builtin.set_fact:
    app_mongo_root_pw: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
    app_mongo_app_pw: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
    app_admin_pin: "{{ admin_pin if (admin_pin | string | length > 0) else lookup('ansible.builtin.password', '/dev/null length=4 chars=digits') }}"
  when: not app_envfile.stat.exists

- name: Write .env (only when missing, mode 0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ install_dir }}/.env"
    mode: "0600"
  when: not app_envfile.stat.exists

# --- build + bring the stack up ---------------------------------------------
# Pre-pull only the registry images (mongo, grafana) so they persist for
# offline use. --ignore-buildable skips the app service, which is built locally
# from the Dockerfile and is NOT on any registry (pulling it would fail with
# "pull access denied for stem-data-wall-app").
- name: Pre-pull the registry images (skip the locally built app)
  ansible.builtin.command: docker compose pull --ignore-buildable
  args:
    chdir: "{{ install_dir }}"
  changed_when: false

# Build the app image explicitly. Idempotent: Docker reuses the same image ID
# when nothing changed (all layers cached), so we only report "changed" when
# the resulting image ID actually differs from before the build.
- name: Get the app image ID before building
  ansible.builtin.command: docker images -q stem-data-wall-app:latest
  register: app_img_before
  changed_when: false

- name: Build the app image
  ansible.builtin.command: docker compose build app
  args:
    chdir: "{{ install_dir }}"
  environment:
    # Build an attestation-free, deterministic image so its ID is identical
    # across cache-only rebuilds. That keeps the idempotency check below
    # correct on BOTH the classic and the containerd image stores (with build
    # provenance on, the containerd store re-exports a new attestation manifest
    # every build, churning the ID), and keeps the kiosk image lean.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  changed_when: false

- name: Get the app image ID after building
  ansible.builtin.command: docker images -q stem-data-wall-app:latest
  register: app_img_after
  changed_when: app_img_after.stdout | trim != app_img_before.stdout | trim

# pull_policy: build means `up` also runs a (cache-only) build; the same env
# keeps that deterministic so an unchanged image never triggers a container
# recreate. changed_when ignores build output and only reacts to real
# container state changes.
- name: Start the stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ install_dir }}"
  environment:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  register: app_compose_up
  changed_when: >-
    ('Started' in app_compose_up.stderr) or
    ('Recreate' in app_compose_up.stderr) or
    ('Created' in app_compose_up.stderr)

# --- show the PIN so staff can unlock /admin --------------------------------
- name: Read the admin PIN from .env
  ansible.builtin.slurp:
    src: "{{ install_dir }}/.env"
  register: app_env_slurp

- name: Show the admin PIN + URLs
  ansible.builtin.debug:
    msg:
      - "App is up. Admin PIN: {{ (app_env_slurp.content | b64decode | regex_search('ADMIN_PIN=(.*)', '\\1'))[0] }}"
      - "Monitor:    http://{{ datawall_host }}:8080/"
      - "Controller: http://{{ datawall_host }}:8080/controller"
      - "Staff:      http://{{ datawall_host }}:8080/staff"
      - "Grafana:    http://{{ datawall_host }}:3000/"
