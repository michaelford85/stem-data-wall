---
kiosk_user: kiosk
# Chromium kiosk flags. --ozone-platform=wayland is needed under cage.
# The long update interval + no-first-run keep it quiet and offline-friendly.
kiosk_chromium_flags: >-
  --kiosk --noerrdialogs --disable-infobars --no-first-run
  --disable-session-crashed-bubble --disable-features=TranslateUI
  --check-for-update-interval=31536000 --ozone-platform=wayland
